name: Deploy to Cloudflare Workers & D1 (Free Tier)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional Git tag or commit SHA to build and deploy (supports rollback)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: 'cloudflare-workers-deploy'
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-Deploy Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Verify D1 SQLite migrations (33 tables, FKs, indexes)
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { DatabaseSync } from 'node:sqlite';
            const db = new DatabaseSync(':memory:');
            const files = fs.readdirSync('migrations').filter((f) => f.endsWith('.sql')).sort();
            for (const f of files) {
              db.exec(fs.readFileSync('migrations/' + f, 'utf8'));
            }
            const tables = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\").all();
            const indexes = db.prepare(\"SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%'\").all();
            const fkViolations = db.prepare('PRAGMA foreign_key_check').all();
            if (tables.length !== 33 || indexes.length < 20 || fkViolations.length > 0) process.exit(1);
          "

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run eslint

      - name: Run unit, security, and Worker API/RBAC tests
        run: npm test

      - name: Build production client bundle
        run: npm run build

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-dist
          path: dist/
          retention-days: 5

  deploy:
    name: Migrate D1 & Deploy Worker to Free workers.dev
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Download verified frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: aegis-dist
          path: dist/

      - name: Validate Cloudflare credentials and D1 binding
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret. Add both in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" wrangler.toml; then
            if [ -n "$CF_D1_DATABASE_ID" ]; then
              sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${CF_D1_DATABASE_ID}/g" wrangler.toml
              echo "Injected D1 database_id from repository secret."
            else
              echo "::error::wrangler.toml still has REPLACE_WITH_YOUR_D1_DATABASE_ID. Run 'npx wrangler d1 create aegis-enterprise-db' and either commit the database_id into wrangler.toml or store it in CLOUDFLARE_D1_DATABASE_ID secret."
              exit 1
            fi
          fi

      - name: Apply remote D1 SQLite migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply aegis-enterprise-db --remote

      - name: Deploy Worker & static assets to workers.dev
        id: cf-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          WORKERS_URL=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -n 1 || true)
          echo "url=$WORKERS_URL" >> "$GITHUB_OUTPUT"

      - name: Verify live production endpoints
        if: steps.cf-deploy.outputs.url != ''
        run: |
          LIVE_URL="${{ steps.cf-deploy.outputs.url }}"
          echo "Verifying live deployment at $LIVE_URL"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$LIVE_URL/" >/dev/null
          HEALTH=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$LIVE_URL/api/health")
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"engine":"cloudflare-d1-sqlite"'
          STATUS=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$LIVE_URL/api/auth/status")
          echo "Auth status: $STATUS"
          echo "$STATUS" | grep -q '"databaseReady":true'
