name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: SQLite Migration, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify D1 SQLite migration schema
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { DatabaseSync } from 'node:sqlite';
            const db = new DatabaseSync(':memory:');
            db.exec(fs.readFileSync('migrations/0001_init.sql', 'utf8'));
            const rows = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\").all();
            console.log('Verified D1 tables:', rows.length);
            if (rows.length !== 26) process.exit(1);
          "

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run security and Worker API/RBAC tests
        run: npm test

      - name: Build production client bundle
        run: npm run build
