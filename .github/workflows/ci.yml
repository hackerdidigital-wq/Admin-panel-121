name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lockfile, D1 Schema, Typecheck, ESLint, Tests & Worker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Verify D1 SQLite migrations (36 tables, FKs, indexes)
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { DatabaseSync } from 'node:sqlite';
            const db = new DatabaseSync(':memory:');
            const files = fs.readdirSync('migrations').filter((f) => f.endsWith('.sql')).sort();
            for (const f of files) {
              db.exec(fs.readFileSync('migrations/' + f, 'utf8'));
            }
            const tables = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\").all();
            const indexes = db.prepare(\"SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%'\").all();
            const fkViolations = db.prepare('PRAGMA foreign_key_check').all();
            console.log('Verified D1 migrations:', files.length, 'tables:', tables.length, 'indexes:', indexes.length);
            if (tables.length !== 36 || indexes.length < 24 || fkViolations.length > 0) process.exit(1);
          "

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run eslint

      - name: Run unit, security, migration, and Worker API/RBAC tests
        run: npm test

      - name: Build production client bundle
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
