name = "aegis-enterprise-console"
main = "src/worker/index.ts"
compatibility_date = "2025-03-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Free-tier Cloudflare D1 SQLite database binding.
# 1. Create your free D1 database: npx wrangler d1 create aegis-enterprise-db
# 2. Replace database_id below with the returned UUID (or set CLOUDFLARE_D1_DATABASE_ID in GitHub Secrets).
[[d1_databases]]
binding = "DB"
database_name = "aegis-enterprise-db"
database_id = "729e2d77-0091-419f-875e-c862aca1ad8e"
migrations_dir = "migrations"
